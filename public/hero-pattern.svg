<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .flower-stroke { fill: none; stroke: #E5A8A8; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }
      .stitch { fill: none; stroke: #E5A8A8; stroke-width: 1; stroke-linecap: round; opacity: 0.35; }
      .dot { fill: #E5A8A8; opacity: 0.30; }
    </style>
  </defs>

  <!-- Flower 1 — top-left area -->
  <g class="flower-stroke" transform="translate(45, 50)">
    <ellipse cx="0" cy="-8" rx="3.5" ry="7" transform="rotate(0)"/>
    <ellipse cx="0" cy="-8" rx="3.5" ry="7" transform="rotate(72)"/>
    <ellipse cx="0" cy="-8" rx="3.5" ry="7" transform="rotate(144)"/>
    <ellipse cx="0" cy="-8" rx="3.5" ry="7" transform="rotate(216)"/>
    <ellipse cx="0" cy="-8" rx="3.5" ry="7" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="2.5" fill="#E5A8A8" fill-opacity="0.30" stroke="none"/>
  </g>

  <!-- Flower 2 — center-right -->
  <g class="flower-stroke" transform="translate(155, 110)">
    <ellipse cx="0" cy="-6" rx="2.8" ry="5.5" transform="rotate(15)"/>
    <ellipse cx="0" cy="-6" rx="2.8" ry="5.5" transform="rotate(87)"/>
    <ellipse cx="0" cy="-6" rx="2.8" ry="5.5" transform="rotate(159)"/>
    <ellipse cx="0" cy="-6" rx="2.8" ry="5.5" transform="rotate(231)"/>
    <ellipse cx="0" cy="-6" rx="2.8" ry="5.5" transform="rotate(303)"/>
    <circle cx="0" cy="0" r="2" fill="#E5A8A8" fill-opacity="0.30" stroke="none"/>
  </g>

</svg>
